<!DOCTYPE html>
<html lang="th">

<body>

    <ul id="menu">
        <li>ข้าวผัด</li>
        <li>ผัดไทย</li>
        <li>ต้มยำกุ้ง</li>
    </ul>
    <p id="result">ยังไม่ได้เลือก</p>

    <script>
        const menu = document.getElementById("menu");
        const result = document.getElementById("result");

        menu.addEventListener("click", function (event) {
            if (event.target.tagName === "LI") {
                result.textContent = "คุณเลือก: " + event.target.textContent;
            }
        });

        const newLi = document.createElement("li");
        newLi.textContent = "ส้มตำ (เพิ่มทีหลัง)";
        menu.appendChild(newLi);
    </script>

</body>

</html>
